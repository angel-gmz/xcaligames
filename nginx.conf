server {
    listen 80;
    server_name xcaligames.cloud www.xcaligames.cloud _;

    root /usr/share/nginx/html;
    index index.html;

    # Evitar exponer versión de Nginx y ajustar redirecciones limpias en contenedor
    server_tokens off;
    port_in_redirect off;
    absolute_redirect off;

    # Compresión Gzip de alto rendimiento
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        font/woff2
        image/svg+xml;

    # Cabeceras de Seguridad globales
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Eliminación de barra final para evitar contenido duplicado (SEO Canonical)
    rewrite ^/(.*)/$ /$1 permanent;

    # 1. Caché agresiva e inmutable (1 año) para bundles de Astro y recursos estáticos
    location ^~ /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    location ~* \.(?:webp|avif|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf|css|js)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    # 2. Caché de revalidación inmediata para HTML, XML (Sitemap/RSS) y robots.txt
    location ~* \.(?:html|xml|txt)$ {
        expires -1;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # 3. Manejo de rutas limpias sin barra final ni extensión (alineado con build.format: 'file')
    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri.html $uri/index.html =404;
    }

    # 4. Página de error 404 personalizada
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}

